name: Deploy to Server

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: 22
        script: |
          cd <DEPLOY_DIR>/gpu-daily-status-tracker   # 部署目录: 按实际路径修改
          git pull origin master
          sudo nginx -t && sudo systemctl reload nginx
          pm2 restart gpu-daily-api   # PM2 进程名: 按实际进程修改